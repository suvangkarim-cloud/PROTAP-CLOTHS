function crow(box,c){const d=document.createElement('div');d.className='cr glass';d.style.cssText='padding:12px;margin-bottom:10px;display:grid;gap:8px';let keep=[...(c.imgs||[])];

 const th=d.querySelector('.th'),draw=()=>{th.innerHTML=keep.map((u,i)=>`<span style="position:relative"><img src="${esc(u)}" alt="" style="height:52px;width:52px;object-fit:cover"><a data-k="${i}" style="position:absolute;top:-7px;right:-7px;background:#000;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;cursor:pointer;font-size:11px;color:#e58a7e">✕</a></span>`).join('');th.querySelectorAll('[data-k]').forEach(a=>a.onclick=()=>{keep.splice(+a.dataset.k,1);draw()})};draw();
 d.querySelector('.cx').onclick=()=>d.remove();d._keep=()=>keep;box.appendChild(d);return d}

 document.body.appendChild(o);mapP(r).cs.forEach(c=>crow($('#ecs'),c));$('#eac').onclick=()=>crow($('#ecs'),{});$('#ex').onclick=()=>o.remove();
